# Dove va "default" per alsa-lib.
#
# PERCHE' PIU' DI UN NOME: l'HAL audio (audio.primary.waydroid.so) non contiene
# NESSUN nome di dispositivo fra le sue stringhe, quindi quale apra non si sa
# leggendo il binario. Si coprono i tre nomi che un HAL nato per Waydroid puo'
# usare. Con il solo "default" non bastava.
#
# PROVATO E SCARTATO : fissare period_size e buffer_size sullo
# slave per dare piu' respiro alla scheda (l'idea era compensare i 21 ms con
# cui l'HAL apre il PCM). Risultato PEGGIORE: la negoziazione fallisce e l'HAL
# non apre piu' niente, con "Failed to open pcm_out after 100 tries" ogni due
# secondi e AudioFlinger bloccato in scrittura. Lasciare che sia l'HAL a
# scegliere i parametri.
pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}

pcm.!sysdefault {
    type plug
    slave.pcm "hw:0,0"
}

pcm.pulse {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}
